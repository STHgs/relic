name: 功能建议
description: 建议新能力或改动现有行为（适配器、规则模型、同步/升级、安装体验）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先读 [docs/ARCHITECTURE.md](https://github.com/STHgs/relic/blob/main/docs/ARCHITECTURE.md) 与
        [CONTRIBUTING.md](https://github.com/STHgs/relic/blob/main/CONTRIBUTING.md) 里的「不变量」——
        有些设计取舍是有意的（例如治理不注入平台权限）。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，不要只写方案
      placeholder: "我在 ... 场景下需要 ...，现在只能 ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 越具体越好；若你知道涉及哪些文件/模块，一并写出
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响面
      options:
        - 渲染器（src/render/，需同提交 bump golden）
        - 适配器（src/adapters/，新增平台）
        - 核心管线（src/core/：加载/校验/同步/升级）
        - 安装与调度（scripts/、install.sh、setup.ps1）
        - 文档 / 模板 / 测试
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括「不用这个项目也能解决」的方案

  - type: checkboxes
    id: invariants
    attributes:
      label: 不变量核对
      options:
        - label: 该建议不会让渲染器读取本机状态或时钟（机器输入须经 policies.meta 显式注入）
          required: false
        - label: 该建议不会让引擎库包含身份内容（policies.yaml / modules/）
          required: false
