name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build relic-setup.zip
        run: |
          mkdir -p dist
          cp scripts/setup.ps1 dist/relic-setup.ps1
          cp relic-setup.cmd dist/relic-setup.cmd
          cd dist && zip -r ../relic-setup.zip .

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" relic-setup.zip --clobber
          else
            gh release create "$TAG" relic-setup.zip --title "$TAG" --generate-notes $PRE
          fi
